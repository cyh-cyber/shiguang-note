spring:
  data:
    redis:
      database: 1 # Redis 数据库索引（避免与其它服务混在一起，这里用 1）
      host: 127.0.0.1 # Redis 服务器地址
      port: 6379 # Redis 服务器连接端口
      password: qwe123!@# # Redis 服务器连接密码
      timeout: 5s # 读超时时间
      connect-timeout: 5s # 链接超时时间
      lettuce:
        pool:
          max-active: 200 # 连接池最大连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（负值表示没有限制）
          min-idle: 0 # 连接池中的最小空闲连接
          max-idle: 10 # 连接池中的最大空闲连接

  # ==================== Kafka ====================
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      acks: all # 等所有 ISR 副本确认，最稳
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true # 幂等生产者，防网络重试导致的重复消息
        max.in.flight.requests.per.connection: 1 # 与幂等生产者配套，避免乱序
        linger.ms: 20 # 攒 20ms 再发，提高吞吐
        batch.size: 16384
    consumer:
      group-id: shiguang-moderation # 兜底值，实际以 @KafkaListener 的 groupId 为准
      auto-offset-reset: earliest # 找不到位点时从头消费
      enable-auto-commit: false # 关闭自动提交，改手动 ack
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 200
    listener:
      type: single # 全局默认单条；批量容器在 KafkaConfig 里单独建
      ack-mode: manual_immediate # 手动提交位点，配 @KafkaListener 的 Acknowledgment 参数
      concurrency: 3
      missing-topics-fatal: false # topic 不存在时不要让应用起不来

# ==================== 业务自定义 ====================
elasticsearch:
  address: 127.0.0.1:9200 # ES 直连地址，格式 host:port（与 search 模块保持一致）

moderation:
  # 预留：Kafka topic / group 名称已在 KafkaTopics 常量中定义，
  # 若希望支持多环境动态调整，可在里程碑 2 改为从这里读取。
  kafka:
    content-review-topic: shiguang.content.review
    content-review-dlt-topic: shiguang.content.review.DLT
    engine-group: moderation-engine
    stat-group: moderation-stat
  rule:
    max-length: 2000 # 内容超长直接加分，进入人工复审
    review-score: 10 # 风险分 >= 10 → 待人工复审
    reject-score: 30 # 风险分 >= 30 → 直接拒绝
  sensitive-word-file: classpath:sensitive-words.txt # 敏感词词库位置
